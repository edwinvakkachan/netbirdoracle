version: "3.8"

services:
  container-monitor:
    build: .
    container_name: container-monitor
    restart: unless-stopped

    volumes:
      - /home/wreath1553/.ssh:/root/.ssh

    environment:
      - TZ=Asia/Kolkata
    dns:
      - 1.1.1.1
      - 1.0.0.1

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"